paths:
  yata_directory: '~/.yata/'
  locked_file: '~/.yata/locked.bin'

# If the user chooses not to set a password for ease of access, use this
# "password" to lock the file, but since this is open source it really
# isn't secure and there should be UI warnings telling them to set it
default_password: "uQjPMbGEa6D2u9"

auth_types:
  - name: '2fas'
  # file extension used by the export function of the authenticator app
    extension: '2fas'

  # these are placeholders until I find out what extensions are used by these apps
  - name: 'lastpass'
    extension: 'csv'

  - name: 'keepass'
    extension: 'kdbx'
